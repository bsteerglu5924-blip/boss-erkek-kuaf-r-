<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yönetim Paneli — BOSS Erkek Kuaförü</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body{ min-height: 100vh; }
  header{
    border-bottom: 1px solid var(--line);
    background: var(--surface-hi);
  }
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    padding-block: 0.9rem;
  }
  .brand{
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.5rem;
    letter-spacing: 0.03em;
    display:flex; align-items:center; gap:0.6rem;
  }
  .brand-logo{ height: 40px; width: 40px; border-radius: 50%; object-fit: cover; }
  .brand small{
    font-family: var(--font-body);
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  main{ padding-block: clamp(2rem, 5vw, 3.5rem); }
  #loginView{ max-width: 420px; margin-inline: auto; }
  #loginView h1{ font-size: var(--fs-h3); text-transform: uppercase; margin-bottom: 1.5rem; text-align:center; }
  #loginView form{ display:flex; flex-direction:column; gap: 1rem; }
  #loginView .btn{ margin-top: 0.5rem; justify-content:center; }
  .hidden{ display:none !important; }

  .panel{
    background: var(--surface-hi);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: clamp(1.5rem, 4vw, 2.25rem);
    margin-bottom: 2.5rem;
  }
  .panel h2{ font-size: var(--fs-h3); text-transform: uppercase; margin-bottom: 1.25rem; }
  .filters{ display:flex; flex-wrap:wrap; gap: 1rem; align-items:flex-end; margin-bottom: 1.5rem; }
  .filters .field{ min-width: 180px; }

  .appt-row{
    display:grid; gap: 0.9rem;
    grid-template-columns: 1fr;
    padding: 1.1rem 0;
    border-bottom: 1px solid var(--line);
  }
  .appt-row:last-child{ border-bottom:none; }
  @media (min-width: 760px){
    .appt-row{ grid-template-columns: 1fr 1fr 1fr auto auto; align-items:center; }
  }
  .appt-when{ font-weight: 700; font-variant-numeric: tabular-nums; }
  .appt-when small{ display:block; font-weight:500; color: var(--ink-soft); font-size: var(--fs-small); }
  .appt-who strong{ display:block; }
  .appt-who span{ color: var(--ink-soft); font-size: var(--fs-small); }
  .appt-what small{ display:block; color: var(--ink-soft); font-size: var(--fs-small); }
  .appt-status select{
    font-family: var(--font-body); font-size: var(--fs-small); font-weight:600;
    padding: 0.55rem 0.7rem; border-radius: var(--radius); border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); min-height: 44px;
  }
  .appt-price label{ display:block; font-size: var(--fs-label); text-transform:uppercase; letter-spacing:0.05em; color: var(--ink-soft); margin-bottom: 0.25rem; }
  .appt-price input{
    font-family: var(--font-body); font-size: var(--fs-small); font-weight:600;
    width: 110px; padding: 0.55rem 0.6rem; border-radius: var(--radius); border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); min-height: 44px;
  }

  /* ============ CIRO ============ */
  .revenue-summary{
    display:grid; gap: 1rem;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    margin-bottom: 1.5rem;
  }
  .revenue-stat{
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 1.1rem 1.2rem;
  }
  .revenue-stat .label{ font-size: var(--fs-label); text-transform:uppercase; letter-spacing:0.08em; color: var(--ink-soft); }
  .revenue-stat .value{ font-family: var(--font-display); font-size: 1.9rem; font-weight:800; margin-top:0.2rem; font-variant-numeric: tabular-nums; }
  .revenue-barber-row{
    display:flex; justify-content:space-between; align-items:center; gap: 1rem;
    padding: 0.7rem 0; border-bottom: 1px solid var(--line); font-size: var(--fs-small);
  }
  .revenue-barber-row:last-child{ border-bottom:none; }
  .revenue-barber-row strong{ font-variant-numeric: tabular-nums; }

  /* ============ REVIEWS (yorum moderasyonu) ============ */
  .stars{ position:relative; display:inline-block; font-size:0.95rem; line-height:1; color: var(--line); white-space:nowrap; }
  .stars::before{ content:'★★★★★'; }
  .stars-fill{ position:absolute; inset:0; overflow:hidden; color: var(--brass); white-space:nowrap; }
  .stars-fill::before{ content:'★★★★★'; }
  .review-row{ padding: 1rem 0; border-bottom: 1px solid var(--line); display:flex; flex-direction:column; gap:0.6rem; }
  .review-row:last-child{ border-bottom:none; }
  .review-row-head{ display:flex; flex-wrap:wrap; align-items:center; gap:0.6rem; justify-content:space-between; }
  .review-row-who{ font-weight:700; display:flex; align-items:center; gap:0.6rem; }
  .review-row-comment{ font-size: var(--fs-small); }
  .review-row-when{ font-size: var(--fs-small); color: var(--ink-soft); }
  .review-row-actions{ display:flex; flex-wrap:wrap; gap:0.5rem; }

  .blocked-form{ display:grid; gap: 1rem; grid-template-columns: 1fr; margin-bottom: 1.5rem; }
  @media (min-width: 760px){ .blocked-form{ grid-template-columns: repeat(4, 1fr) auto; align-items:end; } }
  .blocked-row{
    display:flex; justify-content:space-between; align-items:center; gap: 1rem;
    padding: 0.85rem 0; border-bottom: 1px solid var(--line); font-size: var(--fs-small);
  }
  .blocked-row:last-child{ border-bottom:none; }
  .blocked-row strong{ font-variant-numeric: tabular-nums; }

  .chat-row{
    padding: 1rem 0;
    border-bottom: 1px solid var(--line);
  }
  .chat-row:last-child{ border-bottom:none; }
  .chat-summary{
    display:flex; flex-wrap:wrap; gap: 0.6rem 1rem; align-items:center;
    width:100%; text-align:left;
    background:transparent; border:none; padding:0; cursor:pointer;
    font-family: var(--font-body); color: var(--ink);
  }
  .chat-when{ font-weight:700; font-variant-numeric: tabular-nums; flex:none; }
  .chat-preview{
    flex:1; min-width: 160px;
    color: var(--ink-soft); font-size: var(--fs-small);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .chat-count{ font-size: var(--fs-label); letter-spacing:0.08em; text-transform:uppercase; color: var(--ink-soft); flex:none; }
  .chat-transcript{
    margin-top: 0.9rem;
    display:flex; flex-direction:column; gap: 0.5rem;
    padding: 0.9rem;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .chat-bubble{
    max-width: 80%;
    padding: 0.55rem 0.8rem;
    border-radius: 12px;
    font-size: var(--fs-small);
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .chat-bubble.user{ align-self:flex-end; background: var(--brass); color: var(--brass-ink); border-bottom-right-radius:4px; }
  .chat-bubble.assistant{ align-self:flex-start; background: var(--surface-hi); border:1px solid var(--line); border-bottom-left-radius:4px; }
</style>
</head>
<body>

<header>
  <div class="container nav">
    <a class="brand" href="index.html"><img class="brand-logo" src="logo.png" alt="" aria-hidden="true">BOSS <small>Yönetim Paneli</small></a>
    <button type="button" class="btn btn-ghost btn-sm hidden" id="logoutBtn">Çıkış Yap</button>
  </div>
</header>

<main class="container">

  <section id="loginView">
    <h1>Yönetici Girişi</h1>
    <div class="contact-card">
      <form id="loginForm">
        <div class="field">
          <label for="loginEmail">E-posta</label>
          <input type="email" id="loginEmail" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="loginPassword">Parola</label>
          <input type="password" id="loginPassword" autocomplete="current-password" required>
        </div>
        <div class="booking-msg" id="loginMsg"></div>
        <button type="submit" class="btn btn-primary">Giriş Yap</button>
      </form>
    </div>
  </section>

  <section id="dashboardView" class="hidden">

    <div class="panel">
      <h2>Ciro</h2>
      <div class="filters">
        <div class="field">
          <label for="revenueRange">Aralık</label>
          <select id="revenueRange">
            <option value="today">Bugün</option>
            <option value="week">Bu Hafta</option>
            <option value="month" selected>Bu Ay</option>
            <option value="custom">Özel Aralık</option>
          </select>
        </div>
        <div class="field hidden" id="revenueFromField">
          <label for="revenueFrom">Başlangıç</label>
          <input type="date" id="revenueFrom">
        </div>
        <div class="field hidden" id="revenueToField">
          <label for="revenueTo">Bitiş</label>
          <input type="date" id="revenueTo">
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="refreshRevenue">Yenile</button>
      </div>
      <div class="revenue-summary" id="revenueSummary"><p class="booking-empty">Yükleniyor…</p></div>
      <div id="revenueByBarber"></div>
    </div>

    <div class="panel">
      <h2>Randevular</h2>
      <div class="filters">
        <div class="field">
          <label for="filterDate">Tarih</label>
          <input type="date" id="filterDate">
        </div>
        <div class="field">
          <label for="filterStatus">Durum</label>
          <select id="filterStatus">
            <option value="all">Tümü (iptal hariç)</option>
            <option value="pending">Bekliyor</option>
            <option value="confirmed">Onaylandı</option>
            <option value="completed">Tamamlandı</option>
            <option value="cancelled">İptal Edildi</option>
            <option value="no_show">Gelmedi</option>
          </select>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="refreshAppts">Yenile</button>
      </div>
      <div id="apptList"><p class="booking-empty">Yükleniyor…</p></div>
    </div>

    <div class="panel">
      <h2>Müsaitlik / İzin Ekle</h2>
      <form class="blocked-form" id="blockedForm">
        <div class="field">
          <label for="blockedBarber">Berber</label>
          <select id="blockedBarber" required></select>
        </div>
        <div class="field">
          <label for="blockedStart">Başlangıç</label>
          <input type="datetime-local" id="blockedStart" required>
        </div>
        <div class="field">
          <label for="blockedEnd">Bitiş</label>
          <input type="datetime-local" id="blockedEnd" required>
        </div>
        <div class="field">
          <label for="blockedReason">Sebep</label>
          <input type="text" id="blockedReason" placeholder="İzin, öğle molası…">
        </div>
        <button type="submit" class="btn btn-primary">Ekle</button>
      </form>
      <div class="booking-msg" id="blockedMsg"></div>
      <div id="blockedList"><p class="booking-empty">Yükleniyor…</p></div>
    </div>

    <div class="panel">
      <h2>Sohbetler</h2>
      <div class="filters">
        <button type="button" class="btn btn-ghost btn-sm" id="refreshChats">Yenile</button>
      </div>
      <div id="chatList"><p class="booking-empty">Yükleniyor…</p></div>
    </div>

    <div class="panel">
      <h2>Yorumlar</h2>
      <div class="filters">
        <div class="field">
          <label for="reviewFilterStatus">Durum</label>
          <select id="reviewFilterStatus">
            <option value="pending" selected>Onay Bekleyen</option>
            <option value="approved">Onaylanan</option>
            <option value="rejected">Reddedilen</option>
            <option value="all">Tümü</option>
          </select>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="refreshReviews">Yenile</button>
      </div>
      <div id="reviewList"><p class="booking-empty">Yükleniyor…</p></div>
    </div>

  </section>

</main>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const supabase = createClient(
    'https://nvwyaxtwamjsghnxlwol.supabase.co',
    'sb_publishable_rQoEvjFL3jOueZrPUIS9eA_1KpIS0aJ'
  );

  const loginView = document.getElementById('loginView');
  const dashboardView = document.getElementById('dashboardView');
  const logoutBtn = document.getElementById('logoutBtn');
  const loginForm = document.getElementById('loginForm');
  const loginMsg = document.getElementById('loginMsg');

  const dl = new Intl.DateTimeFormat('tr-TR', { timeZone: 'Europe/Istanbul', day: '2-digit', month: '2-digit' });
  const tl = new Intl.DateTimeFormat('tr-TR', { timeZone: 'Europe/Istanbul', hour: '2-digit', minute: '2-digit' });

  const STATUS_LABELS = {
    pending: 'Bekliyor', confirmed: 'Onaylandı', completed: 'Tamamlandı',
    cancelled: 'İptal Edildi', no_show: 'Gelmedi',
  };

  function todayIstanbul(){
    const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Istanbul', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
    const map = Object.fromEntries(parts.map(p => [p.type, p.value]));
    return `${map.year}-${map.month}-${map.day}`;
  }

  async function showView(loggedIn){
    if(loggedIn){
      const { data: isAdmin, error } = await supabase.rpc('is_admin');
      if(error || !isAdmin){
        loginMsg.innerHTML = `<span class="status-badge is-bad"><span class="status-dot" aria-hidden="true"></span>Bu hesabın yönetici yetkisi yok.</span>`;
        await supabase.auth.signOut();
        loginView.classList.remove('hidden');
        dashboardView.classList.add('hidden');
        logoutBtn.classList.add('hidden');
        return;
      }
    }
    loginView.classList.toggle('hidden', loggedIn);
    dashboardView.classList.toggle('hidden', !loggedIn);
    logoutBtn.classList.toggle('hidden', !loggedIn);
    if(loggedIn){
      loadBarbersIntoSelect();
      loadAppointments();
      loadBlockedTimes();
      loadChats();
      loadRevenue();
      loadReviews();
    }
  }

  supabase.auth.getSession().then(({ data }) => showView(!!data.session));
  supabase.auth.onAuthStateChange((_event, session) => showView(!!session));

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginMsg.innerHTML = '';
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if(error){
      loginMsg.innerHTML = `<span class="status-badge is-bad"><span class="status-dot" aria-hidden="true"></span>E-posta veya parola hatalı.</span>`;
    }
  });

  logoutBtn.addEventListener('click', () => supabase.auth.signOut());

  // ============ APPOINTMENTS ============
  const filterDate = document.getElementById('filterDate');
  const filterStatus = document.getElementById('filterStatus');
  const apptList = document.getElementById('apptList');
  filterDate.value = todayIstanbul();

  async function loadAppointments(){
    apptList.innerHTML = '<p class="booking-empty">Yükleniyor…</p>';
    const dayStart = new Date(`${filterDate.value}T00:00:00+03:00`).toISOString();
    const dayEnd = new Date(`${filterDate.value}T23:59:59+03:00`).toISOString();

    let query = supabase
      .from('appointments')
      .select('id,starts_at,ends_at,status,customer_name,customer_phone,customer_email,notes,charged_price_try,barbers(name),services(name)')
      .gte('starts_at', dayStart)
      .lte('starts_at', dayEnd)
      .order('starts_at');

    if(filterStatus.value === 'all'){
      query = query.neq('status', 'cancelled');
    } else {
      query = query.eq('status', filterStatus.value);
    }

    const { data, error } = await query;
    if(error){
      apptList.innerHTML = '<p class="booking-empty">Randevular yüklenemedi.</p>';
      return;
    }
    if(!data.length){
      apptList.innerHTML = '<p class="booking-empty">Bu filtreyle randevu bulunamadı.</p>';
      return;
    }
    apptList.innerHTML = '';
    data.forEach(appt => {
      const start = new Date(appt.starts_at);
      const row = document.createElement('div');
      row.className = 'appt-row';
      row.innerHTML = `
        <div class="appt-when">${tl.format(start)}<small>${dl.format(start)}</small></div>
        <div class="appt-who"><strong>${appt.customer_name}</strong><span>${appt.customer_phone}</span>${appt.customer_email ? `<span>${appt.customer_email}</span>` : ''}</div>
        <div class="appt-what">${appt.services?.name || '—'}<small>${appt.barbers?.name || '—'}${appt.notes ? ' · ' + appt.notes : ''}</small></div>
        <div class="appt-price"><label for="price-${appt.id}">Tutar (₺)</label></div>
        <div class="appt-status"></div>
      `;
      const priceInput = document.createElement('input');
      priceInput.type = 'number';
      priceInput.id = `price-${appt.id}`;
      priceInput.min = '0';
      priceInput.step = '0.01';
      priceInput.placeholder = '—';
      priceInput.value = appt.charged_price_try ?? '';
      priceInput.addEventListener('change', async () => {
        const val = priceInput.value === '' ? null : Number(priceInput.value);
        priceInput.disabled = true;
        const { error: priceErr } = await supabase.from('appointments').update({ charged_price_try: val }).eq('id', appt.id);
        priceInput.disabled = false;
        if(priceErr){ alert('Tutar güncellenemedi: ' + priceErr.message); priceInput.value = appt.charged_price_try ?? ''; }
        else { appt.charged_price_try = val; loadRevenue(); }
      });
      row.querySelector('.appt-price').appendChild(priceInput);

      const select = document.createElement('select');
      Object.entries(STATUS_LABELS).forEach(([value, label]) => {
        const opt = document.createElement('option');
        opt.value = value; opt.textContent = label;
        if(value === appt.status) opt.selected = true;
        select.appendChild(opt);
      });
      select.addEventListener('change', async () => {
        select.disabled = true;
        const { error: updErr } = await supabase.from('appointments').update({ status: select.value }).eq('id', appt.id);
        select.disabled = false;
        if(updErr){ alert('Durum güncellenemedi: ' + updErr.message); select.value = appt.status; }
        else { appt.status = select.value; loadRevenue(); }
      });
      row.querySelector('.appt-status').appendChild(select);
      apptList.appendChild(row);
    });
  }

  document.getElementById('refreshAppts').addEventListener('click', loadAppointments);
  filterDate.addEventListener('change', loadAppointments);
  filterStatus.addEventListener('change', loadAppointments);

  // ============ CIRO ============
  const money = new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY', maximumFractionDigits: 0 });
  const revenueRange = document.getElementById('revenueRange');
  const revenueFrom = document.getElementById('revenueFrom');
  const revenueTo = document.getElementById('revenueTo');
  const revenueFromField = document.getElementById('revenueFromField');
  const revenueToField = document.getElementById('revenueToField');
  const revenueSummary = document.getElementById('revenueSummary');
  const revenueByBarber = document.getElementById('revenueByBarber');

  function revenueDateBounds(){
    const today = todayIstanbul();
    if(revenueRange.value === 'custom'){
      return { from: revenueFrom.value || today, to: revenueTo.value || today };
    }
    if(revenueRange.value === 'today'){
      return { from: today, to: today };
    }
    if(revenueRange.value === 'week'){
      const d = new Date(`${today}T00:00:00`);
      const offset = (d.getDay() + 6) % 7; // Pazartesi = 0
      const monday = new Date(d);
      monday.setDate(d.getDate() - offset);
      return { from: monday.toISOString().slice(0, 10), to: today };
    }
    return { from: today.slice(0, 7) + '-01', to: today }; // month
  }

  async function loadRevenue(){
    revenueSummary.innerHTML = '<p class="booking-empty">Yükleniyor…</p>';
    revenueByBarber.innerHTML = '';
    const { from, to } = revenueDateBounds();
    const rangeStart = new Date(`${from}T00:00:00+03:00`).toISOString();
    const rangeEnd = new Date(`${to}T23:59:59+03:00`).toISOString();

    const { data, error } = await supabase
      .from('appointments')
      .select('charged_price_try,barbers(name)')
      .eq('status', 'completed')
      .gte('starts_at', rangeStart)
      .lte('starts_at', rangeEnd);

    if(error){
      revenueSummary.innerHTML = '<p class="booking-empty">Ciro yüklenemedi.</p>';
      return;
    }

    const total = data.reduce((sum, a) => sum + (Number(a.charged_price_try) || 0), 0);
    const count = data.length;
    const missing = data.filter(a => a.charged_price_try == null).length;
    const avg = count ? total / count : 0;

    revenueSummary.innerHTML = `
      <div class="revenue-stat"><span class="label">Toplam Ciro</span><div class="value">${money.format(total)}</div></div>
      <div class="revenue-stat"><span class="label">Tamamlanan Randevu</span><div class="value">${count}</div></div>
      <div class="revenue-stat"><span class="label">Ortalama Fiş</span><div class="value">${money.format(avg)}</div></div>
      ${missing ? `<div class="revenue-stat"><span class="label">Tutarı Eksik</span><div class="value">${missing}</div></div>` : ''}
    `;

    const byBarber = {};
    data.forEach(a => {
      const name = a.barbers?.name || 'Bilinmiyor';
      byBarber[name] = (byBarber[name] || 0) + (Number(a.charged_price_try) || 0);
    });
    const rows = Object.entries(byBarber).sort((a, b) => b[1] - a[1]);
    revenueByBarber.innerHTML = rows.map(([name, sum]) => `
      <div class="revenue-barber-row"><span>${name}</span><strong>${money.format(sum)}</strong></div>
    `).join('');
  }

  revenueRange.addEventListener('change', () => {
    const isCustom = revenueRange.value === 'custom';
    revenueFromField.classList.toggle('hidden', !isCustom);
    revenueToField.classList.toggle('hidden', !isCustom);
    loadRevenue();
  });
  revenueFrom.addEventListener('change', loadRevenue);
  revenueTo.addEventListener('change', loadRevenue);
  document.getElementById('refreshRevenue').addEventListener('click', loadRevenue);

  // ============ BLOCKED TIMES ============
  const blockedBarber = document.getElementById('blockedBarber');
  const blockedForm = document.getElementById('blockedForm');
  const blockedMsg = document.getElementById('blockedMsg');
  const blockedList = document.getElementById('blockedList');

  async function loadBarbersIntoSelect(){
    if(blockedBarber.options.length) return;
    const { data } = await supabase.from('barbers').select('id,name').eq('active', true).order('sort_order');
    (data || []).forEach(b => {
      const opt = document.createElement('option');
      opt.value = b.id; opt.textContent = b.name;
      blockedBarber.appendChild(opt);
    });
  }

  async function loadBlockedTimes(){
    blockedList.innerHTML = '<p class="booking-empty">Yükleniyor…</p>';
    const { data, error } = await supabase
      .from('blocked_times')
      .select('id,starts_at,ends_at,reason,barbers(name)')
      .gte('starts_at', new Date().toISOString())
      .order('starts_at');
    if(error){
      blockedList.innerHTML = '<p class="booking-empty">Yüklenemedi.</p>';
      return;
    }
    if(!data.length){
      blockedList.innerHTML = '<p class="booking-empty">Planlanmış izin/blok yok.</p>';
      return;
    }
    blockedList.innerHTML = '';
    data.forEach(b => {
      const row = document.createElement('div');
      row.className = 'blocked-row';
      const start = new Date(b.starts_at);
      const end = new Date(b.ends_at);
      row.innerHTML = `<span><strong>${b.barbers?.name || '—'}</strong> — ${dl.format(start)} ${tl.format(start)}–${tl.format(end)}${b.reason ? ' · ' + b.reason : ''}</span>`;
      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'btn btn-ghost btn-sm';
      removeBtn.textContent = 'Kaldır';
      removeBtn.addEventListener('click', async () => {
        removeBtn.disabled = true;
        const { error: delErr } = await supabase.from('blocked_times').delete().eq('id', b.id);
        if(delErr){ alert('Kaldırılamadı: ' + delErr.message); removeBtn.disabled = false; }
        else { loadBlockedTimes(); }
      });
      row.appendChild(removeBtn);
      blockedList.appendChild(row);
    });
  }

  blockedForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    blockedMsg.innerHTML = '';
    const startVal = document.getElementById('blockedStart').value;
    const endVal = document.getElementById('blockedEnd').value;
    if(new Date(endVal) <= new Date(startVal)){
      blockedMsg.innerHTML = `<span class="status-badge is-bad"><span class="status-dot" aria-hidden="true"></span>Bitiş, başlangıçtan sonra olmalı.</span>`;
      return;
    }
    const { error } = await supabase.from('blocked_times').insert({
      barber_id: blockedBarber.value,
      starts_at: new Date(startVal).toISOString(),
      ends_at: new Date(endVal).toISOString(),
      reason: document.getElementById('blockedReason').value.trim() || null,
    });
    if(error){
      blockedMsg.innerHTML = `<span class="status-badge is-bad"><span class="status-dot" aria-hidden="true"></span>Eklenemedi: ${error.message}</span>`;
      return;
    }
    blockedForm.reset();
    blockedMsg.innerHTML = `<span class="status-badge is-good"><span class="status-dot" aria-hidden="true"></span>Eklendi.</span>`;
    loadBlockedTimes();
  });

  // ============ CHATS ============
  const chatList = document.getElementById('chatList');

  async function loadChats(){
    chatList.innerHTML = '<p class="booking-empty">Yükleniyor…</p>';
    const { data: sessions, error } = await supabase
      .from('chat_sessions')
      .select('id,created_at,last_message_at,user_message_count,booked_appointment_id')
      .order('last_message_at', { ascending: false })
      .limit(50);

    if(error){
      chatList.innerHTML = '<p class="booking-empty">Sohbetler yüklenemedi.</p>';
      return;
    }
    if(!sessions.length){
      chatList.innerHTML = '<p class="booking-empty">Henüz sohbet yok.</p>';
      return;
    }

    // Her oturumun ilk müşteri mesajını önizleme olarak göster.
    const { data: firsts } = await supabase
      .from('chat_messages')
      .select('session_id,content,created_at')
      .in('session_id', sessions.map(s => s.id))
      .eq('role', 'user')
      .order('created_at');

    const preview = {};
    (firsts || []).forEach(m => {
      if(!preview[m.session_id]) preview[m.session_id] = m.content;
    });

    chatList.innerHTML = '';
    sessions.forEach(s => {
      const row = document.createElement('div');
      row.className = 'chat-row';

      const when = new Date(s.last_message_at);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chat-summary';
      btn.innerHTML = `
        <span class="chat-when">${dl.format(when)} ${tl.format(when)}</span>
        <span class="chat-preview">${preview[s.id] ? preview[s.id].replace(/</g, '&lt;') : '—'}</span>
        ${s.booked_appointment_id ? '<span class="status-badge is-good"><span class="status-dot" aria-hidden="true"></span>Randevu alındı</span>' : ''}
        <span class="chat-count">${s.user_message_count} mesaj</span>
      `;

      const transcript = document.createElement('div');
      transcript.className = 'chat-transcript hidden';
      let loaded = false;

      btn.addEventListener('click', async () => {
        const willOpen = transcript.classList.contains('hidden');
        transcript.classList.toggle('hidden', !willOpen);
        if(!willOpen || loaded) return;
        loaded = true;
        transcript.innerHTML = '<p class="booking-empty">Yükleniyor…</p>';
        const { data: rows, error: msgErr } = await supabase
          .from('chat_messages')
          .select('role,content,created_at')
          .eq('session_id', s.id)
          .neq('role', 'tool')          // araç turları teknik detay, gösterilmez
          .order('created_at');
        // Sadece araç çağıran, metin üretmeyen asistan turlarını da atla.
        const msgs = (rows || []).filter(m => m.content && m.content.trim());
        if(msgErr || !msgs.length){
          transcript.innerHTML = '<p class="booking-empty">Mesajlar yüklenemedi.</p>';
          loaded = false;
          return;
        }
        transcript.innerHTML = '';
        msgs.forEach(m => {
          const bubble = document.createElement('div');
          bubble.className = 'chat-bubble ' + m.role;
          bubble.textContent = m.content;
          transcript.appendChild(bubble);
        });
      });

      row.appendChild(btn);
      row.appendChild(transcript);
      chatList.appendChild(row);
    });
  }

  document.getElementById('refreshChats').addEventListener('click', loadChats);

  // ============ REVIEWS (yorum moderasyonu) ============
  const REVIEW_STATUS_LABELS = { pending: 'Onay Bekliyor', approved: 'Onaylandı', rejected: 'Reddedildi' };
  const reviewFilterStatus = document.getElementById('reviewFilterStatus');
  const reviewList = document.getElementById('reviewList');

  async function loadReviews(){
    reviewList.innerHTML = '<p class="booking-empty">Yükleniyor…</p>';
    let query = supabase
      .from('reviews')
      .select('id,customer_name,rating,comment,status,created_at')
      .order('created_at', { ascending: false });
    if(reviewFilterStatus.value !== 'all'){
      query = query.eq('status', reviewFilterStatus.value);
    }
    const { data, error } = await query;
    if(error){
      reviewList.innerHTML = '<p class="booking-empty">Yorumlar yüklenemedi.</p>';
      return;
    }
    if(!data.length){
      reviewList.innerHTML = '<p class="booking-empty">Bu filtreyle yorum yok.</p>';
      return;
    }
    reviewList.innerHTML = '';
    data.forEach(r => {
      const row = document.createElement('div');
      row.className = 'review-row';
      const when = new Date(r.created_at);
      const badgeClass = r.status === 'approved' ? 'is-good' : (r.status === 'rejected' ? 'is-bad' : '');
      row.innerHTML = `
        <div class="review-row-head">
          <span class="review-row-who">${r.customer_name}<span class="stars" aria-label="${r.rating} / 5 yıldız"><span class="stars-fill" style="width:${r.rating * 20}%"></span></span></span>
          <span class="status-badge ${badgeClass}"><span class="status-dot" aria-hidden="true"></span>${REVIEW_STATUS_LABELS[r.status]}</span>
        </div>
        <p class="review-row-comment">${r.comment.replace(/</g, '&lt;')}</p>
        <div class="review-row-when">${dl.format(when)} ${tl.format(when)}</div>
        <div class="review-row-actions"></div>
      `;
      const actions = row.querySelector('.review-row-actions');

      if(r.status !== 'approved'){
        const approveBtn = document.createElement('button');
        approveBtn.type = 'button'; approveBtn.className = 'btn btn-primary btn-sm'; approveBtn.textContent = 'Onayla';
        approveBtn.addEventListener('click', async () => {
          approveBtn.disabled = true;
          const { error: updErr } = await supabase.from('reviews').update({ status: 'approved' }).eq('id', r.id);
          if(updErr){ alert('Onaylanamadı: ' + updErr.message); approveBtn.disabled = false; }
          else { loadReviews(); }
        });
        actions.appendChild(approveBtn);
      }
      if(r.status !== 'rejected'){
        const rejectBtn = document.createElement('button');
        rejectBtn.type = 'button'; rejectBtn.className = 'btn btn-ghost btn-sm'; rejectBtn.textContent = 'Reddet';
        rejectBtn.addEventListener('click', async () => {
          rejectBtn.disabled = true;
          const { error: updErr } = await supabase.from('reviews').update({ status: 'rejected' }).eq('id', r.id);
          if(updErr){ alert('Reddedilemedi: ' + updErr.message); rejectBtn.disabled = false; }
          else { loadReviews(); }
        });
        actions.appendChild(rejectBtn);
      }
      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button'; deleteBtn.className = 'btn btn-danger btn-sm'; deleteBtn.textContent = 'Sil';
      deleteBtn.addEventListener('click', async () => {
        if(!confirm('Bu yorumu kalıcı olarak silmek istiyor musunuz?')) return;
        deleteBtn.disabled = true;
        const { error: delErr } = await supabase.from('reviews').delete().eq('id', r.id);
        if(delErr){ alert('Silinemedi: ' + delErr.message); deleteBtn.disabled = false; }
        else { loadReviews(); }
      });
      actions.appendChild(deleteBtn);

      reviewList.appendChild(row);
    });
  }

  reviewFilterStatus.addEventListener('change', loadReviews);
  document.getElementById('refreshReviews').addEventListener('click', loadReviews);
</script>

</body>
</html>
